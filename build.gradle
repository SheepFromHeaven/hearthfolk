plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.5.0' // x-release-please-version
group = 'com.sheepfromheaven.minenow'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.3.0.101'

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minenow'
        }

        client {
            client()
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
                jvmArguments.add('-XstartOnFirstThread')
        }

        gametestPlayground {
            client()
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
                jvmArguments.add('-XstartOnFirstThread')
            systemProperty 'minenow.gametestPlayground', 'true'
        }

        server {
            server()
            programArguments.add('--nogui')
        }

        gameTestServer {
            type = 'gameTestServer'
            programArguments.addAll([
                '--report',
                layout.projectDirectory.file('build/test-report.xml').asFile.absolutePath
            ])
            if (providers.gradleProperty('tests').isPresent())
                programArguments.addAll(['--tests', providers.gradleProperty('tests').get()])
        }

        villageSoak {
            type = 'gameTestServer'
            systemProperty 'minenow.soak.only', 'true'
            systemProperty 'minenow.soak.days', providers.gradleProperty('soakDays').orElse('50').get()
            systemProperty 'minenow.soak.trace', providers.gradleProperty('soakTrace').orElse('').get()
            systemProperty 'minenow.soak.traceMines', providers.gradleProperty('soakTraceMines').orElse('false').get()
            systemProperty 'minenow.soak.player', providers.gradleProperty('soakPlayer').orElse('true').get()
            systemProperty 'minenow.soak.bell', providers.gradleProperty('soakBell').orElse('true').get()
            systemProperty 'minenow.soak.playerBudget', providers.gradleProperty('soakPlayerBudget').orElse('0').get()
            systemProperty 'minenow.soak.traceFrom', providers.gradleProperty('soakTraceFrom').orElse('-1').get()
            if (providers.gradleProperty('soakJvm').isPresent())
                jvmArguments.addAll(providers.gradleProperty('soakJvm').get().split(' ').toList())
            if (providers.gradleProperty('soakJfr').isPresent())
                jvmArguments.add('-XX:StartFlightRecording=filename=' + layout.projectDirectory.file('soak-report/soak.jfr').asFile.absolutePath + ',settings=profile,dumponexit=true')
            if (providers.gradleProperty('soakJfr').isPresent())
                jvmArguments.add('-XX:FlightRecorderOptions=stackdepth=512')
            systemProperty 'minenow.soak.out', layout.projectDirectory.dir('soak-report').asFile.absolutePath
        }
    }

    mods {
        minenow {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        testedMod = mods.minenow
        enable()
    }
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    // Mods loaded only in runClient, for trying compatibility by hand; not in gametests and not shipped.
    clientDevMods
}

dependencies {
    clientDevMods 'maven.modrinth:rightclickharvest:OPZ0mGdB'
    clientDevMods 'maven.modrinth:jamlib:Rj4DDcb2'
}

neoForge.runs.client.additionalRuntimeClasspathConfiguration.extendsFrom configurations.clientDevMods

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = '0.3.0' // x-release-please-version
group = 'com.sheepfromheaven.minenow'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = '21.11.45'

    runs {
        configureEach {
            systemProperty 'forge.enabledGameTestNamespaces', 'minenow'
        }

        client {
            client()
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
                jvmArguments.add('-XstartOnFirstThread')
        }

        playtest {
            client()
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
                jvmArguments.add('-XstartOnFirstThread')
            systemProperty 'minenow.devWorld', 'true'
        }

        server {
            server()
            programArguments.add('--nogui')
        }

        gameTestServer {
            type = 'gameTestServer'
            programArguments.addAll([
                '--report',
                layout.projectDirectory.file('build/test-report.xml').asFile.absolutePath
            ])
        }

        data {
            clientData()
            programArguments.addAll([
                '--mod', 'minenow',
                '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
            ])
        }
    }

    mods {
        minenow {
            sourceSet sourceSets.main
        }
    }
}

// Skip the "Accessibility Onboarding" (narrator) screen that Minecraft shows before the title
// screen on a totally fresh run directory - it would otherwise block the auto-join in
// DevWorldBootstrap on first launch. Only ever adds the line; never overwrites an existing
// options.txt the user has customized.
def playtestOptionsFile = layout.projectDirectory.file('run/options.txt').asFile
tasks.named('runPlaytest') {
    doFirst {
        if (!playtestOptionsFile.exists()) {
            playtestOptionsFile.parentFile.mkdirs()
            playtestOptionsFile.text = "onboardAccessibility:false\nsoundCategory_master:0.1\n"
        } else {
            if (!playtestOptionsFile.text.contains('onboardAccessibility:')) {
                playtestOptionsFile.text += "\nonboardAccessibility:false\n"
            }
            if (!playtestOptionsFile.text.contains('soundCategory_master:')) {
                playtestOptionsFile.text += "\nsoundCategory_master:0.1\n"
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.11:5.4.5'
    implementation 'maven.modrinth:screenspec:sByrxfE3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

task printCompileClasspath {
    doLast {
        configurations.compileClasspath.each { println it }
    }
}

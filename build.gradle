plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.4.0' // x-release-please-version
group = 'com.sheepfromheaven.minenow'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.3.0.101'

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minenow'
        }

        client {
            client()
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
                jvmArguments.add('-XstartOnFirstThread')
        }

        gametestPlayground {
            client()
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
                jvmArguments.add('-XstartOnFirstThread')
            systemProperty 'minenow.gametestPlayground', 'true'
        }

        server {
            server()
            programArguments.add('--nogui')
        }

        gameTestServer {
            type = 'gameTestServer'
            programArguments.addAll([
                '--report',
                layout.projectDirectory.file('build/test-report.xml').asFile.absolutePath
            ])
        }
    }

    mods {
        minenow {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        testedMod = mods.minenow
        enable()
    }
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

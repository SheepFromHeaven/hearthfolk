name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: |
          set -o pipefail
          ./gradlew build runGameTestServer --stacktrace 2>&1 | tee gradle.log

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/test_summary.py build/test-report.xml gradle.log build/test-results/test

      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            build/test-report.xml
            gradle.log
          if-no-files-found: ignore
